<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400..700&family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&display=swap" rel="stylesheet">
</head>

<body>
    <div class="contain">
      
         <h2 class="curve">Registration</h2>
         <p class="left"><a href="/pages/login.html" class="curve ">Already have an account</a></p>
        <p id="msg"></p>
        <form action="">
            <div class="inputContain">
                <label for="firstName">FirstName</label>
                <input type="text" autocomplete id="firstName">
            </div>
            <div class="inputContain">
                <label for="lastName">LastName</label>
                <input type="text" autocomplete id="lastName">
            </div>
            <div class="inputContain">
                <label for="otherName">OtherName</label>
                <input type="text" autocomplete id="otherName">
            </div>
            <div class="inputContain">
                <label for="email">Email</label>
                <input type="email" autocomplete id="email">
            </div>
            <div class="inputContain">
                <label for="birthDate">Birth-Date</label>
                <input type="text" autocomplete placeholder="DD/MM/YY" id="birthDate">
            </div>
            <div class="inputContain">
                <label for="password">Password</label>
                <input type="password" autocomplete id="password">
            </div>
            <div class="inputContain">
                <label for="confirmPassword">confirm Password</label>
                <input type="password" autocomplete id="confirmPassword">
            </div>
            <button class="btn curve" id="btnSumbit" type="submit">Register</button>

    
    </div>
    </form>


    <script src="scripts/scr.js"></script>
</body>

</html>
